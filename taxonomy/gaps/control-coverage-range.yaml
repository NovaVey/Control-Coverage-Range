# This range's own GAPS.md, taxonomy-row form — see GAPS.md at repo root for
# the full prose. Required by this project's own stated discipline (every
# GAPS.md entry, including its own, gets a scenario or an explicit reason one
# isn't possible) rather than exempting itself from the rule it applies to
# the four projects it assembles.
source: gaps/control-coverage-range
rows:
  - id: taxonomy-coverage-is-not-real-coverage
    name: Coverage against a named taxonomy is not coverage against reality
    summary: >-
      Every cell in the matrix is scored against a technique this project
      chose to name and give a scenario to. OWASP LLM Top 10 and MITRE
      ATLAS anchor that choice externally so it isn't purely self-serving,
      but neither taxonomy is exhaustive, and a real attacker is not
      obligated to attack in a way any named technique describes. A fully
      green matrix is evidence the named rows are covered, never evidence
      nothing else is possible.
    reference: "GAPS.md #1"
    stillOpen: true
    requiresScenario: false
  - id: scripted-adversary-is-not-a-real-model
    name: A scripted adversary measures a different thing than a live model does
    summary: >-
      Every scenario's adversary.mode defaults to 'scripted' — a fixed,
      deterministic sequence of tool calls, chosen for the same reason
      TTTB's own injection corpus is fixed and deterministic: CI needs a
      stable, reproducible signal, and a live model's own variance would
      make the regression gate (src/report/baseline.ts) meaningless run to
      run. adversary.mode:'live-model' exists and is documented
      (docs/live-model-mode.md) precisely so this isn't silently
      conflated with the scripted result — it answers "would a real,
      unscripted model reach the same tool calls," a genuinely different
      question than "does the stack correctly gate this exact call
      sequence," and it is never used for regression gating.
    reference: "GAPS.md #2; docs/live-model-mode.md"
    stillOpen: true
    requiresScenario: false
  - id: scenario-authorship-bias
    name: Whoever writes scenarios is biased toward ones their own stack passes
    summary: >-
      A project's own test corpus tends to reflect what its author already
      thought to defend against — the same self-selection risk
      Taint-Tracked-Tool-Broker's own GAPS.md #29 names for its injection
      corpus. Mitigated the same way that corpus mitigates it: every entry
      in taxonomy/gaps/*.yaml (pulled from each assembled project's own
      published gap analysis, not authored by this range) is REQUIRED to
      have at least one scenario that asserts the miss, checked mechanically
      by test/gaps-coverage.spec.ts rather than left to reviewer
      attention. This closes the "did we forget to write the scenario for
      an inconvenient finding" half of the bias; it does nothing for the
      harder half — a gap none of the four projects' own authors have
      published yet, that this range's own author also didn't think to add.
    reference: "GAPS.md #3; test/gaps-coverage.spec.ts"
    stillOpen: true
    requiresScenario: false
  - id: expectations-not-empirically-run-at-build-time
    name: This corpus's expected outcomes were derived by reading source, not by an empirical run
    summary: >-
      The environment this range was built in has no running docker daemon,
      so no scenario in this initial corpus was run end-to-end against the
      real assembled stack before being committed — every `expected.cells`
      outcome is this range's author's own careful reading of the four
      projects' real source (cited per-scenario), not a confirmed empirical
      result. The CI workflow (.github/workflows/range.yml) runs the whole
      corpus against a real docker-compose stack on every push — its first
      run against this corpus is this project's first actual empirical
      validation, and any scenario whose asserted outcome turns out wrong
      is expected to surface there, not be silently assumed correct because
      it was never contradicted.
    reference: "GAPS.md #4; .github/workflows/range.yml"
    stillOpen: true
    requiresScenario: false
  - id: matrix-is-a-pinned-snapshot
    name: The matrix reflects one pinned commit of each sibling project, not their current HEAD
    summary: >-
      stack/principal-graph, stack/relationship-based-authorization, and
      stack/attenuated-delegation-chain are git submodules pinned to a
      specific commit each — a real, versioned assembly, not a moving
      target that could silently drift mid-run. But it also means a fix or
      regression landing on any sibling project's own main branch is
      invisible to this matrix until someone bumps that submodule pointer.
      This is a deliberate reproducibility trade, not an oversight, but
      worth naming: "the range says X is covered" is scoped to the pinned
      commits recorded in .gitmodules at the time the matrix was generated.
    reference: "GAPS.md #5; .gitmodules"
    stillOpen: true
    requiresScenario: false
