# Rows found by reading principal-graph's own source directly (this project
# does not publish its own GAPS.md/CAPABILITY-GAPS.md at the commit this
# range vendors — see ARCHITECTURE.md) rather than restated from a doc that
# doesn't exist yet. Each still carries a file:line citation, in the same
# discipline relationship-based-authorization's own CAPABILITY-GAPS.md uses.
source: gaps/principal-graph
rows:
  - id: no-write-http-api
    name: No HTTP write route — seeding requires bypassing the deployed service
    summary: >-
      src/server.ts exposes exactly GET /health, /report, /report.json —
      every write (principals, resources, grants, events, delegation chain
      links) happens only via CLI adapter scripts talking directly to
      Postgres (src/upsert.ts + per-adapter raw grant_edge SQL). This range
      has no external-source adapter to plug into (mcp-config/github/aws/
      workspace/postgres all model a specific real system, not a synthetic
      scenario fixture) — so Control-Coverage-Range's own seeder
      (src/adapters/principal-graph.ts) writes directly to the same
      Postgres database the deployed report server reads from, replicating
      upsert.ts's exact on-conflict pattern rather than reimplementing it
      differently. Recorded here because it is exactly the kind of seam
      this range exists to surface: nothing upstream of this range provides
      a supported way to seed a synthetic identity graph for testing.
    reference: "principal-graph/src/server.ts (route table); principal-graph/src/upsert.ts (ensurePrincipal/ensureResource); principal-graph/src/adapters/ (no generic/fixture adapter exists)"
    stillOpen: true
    requiresScenario: false
    exemptionRationale: >-
      A seeding-mechanism/infrastructure finding about how this range itself
      gets test data into Principal-Graph, not an attack technique — there
      is no adversary step sequence that could meaningfully demonstrate "no
      HTTP write route exists." Every scenario in this corpus already
      depends on the workaround this row describes (direct-to-Postgres
      seeding) succeeding; the row exists to disclose that dependency, not
      to be independently exercised by one more scenario on top of it.
  - id: delegation-chain-non-atomic-write
    name: A crash between the event insert and the delegation_chain_link insert orphans the chain
    summary: >-
      recordDelegationMint()/recordDelegationHop() write the event row via
      EventBatcher.append() and the delegation_chain_link row as a SEPARATE
      second statement — never atomic with the event insert. A process
      crash between the two leaves a real, hash-chained event with no
      lineage row at all, silently breaking chain-intact verification for
      that one link without any error at write time.
    reference: "principal-graph/src/delegation-chain.ts:21-27 (recordDelegationMint/recordDelegationHop, two separate statements)"
    stillOpen: true
    requiresScenario: true
  - id: revocation-guard-blast-radius-bypass
    name: checkBlastRadius() never fires under dryRun, and force explicitly bypasses it
    summary: >-
      The blast-radius circuit breaker (checkBlastRadius(), default
      maxFraction 0.5 / minPriorCount 5) exists specifically so a
      truncated/misconfigured adapter source can't read as "everyone
      genuinely lost access." It is scoped per-resource/per-principal, never
      averaged across a whole run, and is a real, load-bearing safety
      check — but `force: true` is an explicit, always-available bypass with
      no additional confirmation step, and every adapter's dry-run branch
      skips the call entirely (by design, but worth naming as the two ways
      a mass-revocation still reaches Postgres unchecked).
    reference: "principal-graph/src/revocation-guard.ts:85-99 (checkBlastRadius, force bypass)"
    stillOpen: true
    requiresScenario: true
  - id: adc-graph-sink-event-shape-drift
    name: "CLOSED: src/adapters/adc-graph-sink.ts used to be written blind against @adc/graph, and its guessed event shape didn't match the real one"
    summary: >-
      Originally: Principal-Graph's own createAdcGraphSink() disclosed
      plainly that it was "written from a prose description of @adc/graph's
      own worked reference adapter... not copied from that reference
      implementation itself" and asked a future integrator to "confirm [the
      event shape] against the real package before wiring this in for
      real." This range was the first place both real sources were read
      side by side to do that confirmation, and they did not match: the
      real @adc/graph GraphEvent used occurredAt/principal/resource/
      decision/denyReason/taintLabels/reversible/requestDigest,
      Principal-Graph's own guessed at at/agent/blockId/outcome/reason/digest —
      disjoint field names, not wire-compatible without a translation layer
      neither project shipped. A second, narrower bug survived even after
      translating field names: handle() hardcoded
      `ensurePrincipal(pool, { kind: 'agent', ...event.agent })` regardless
      of the real event's own principal.kind, misattributing a mint event's
      real kind:'service' actor as an ordinary agent principal.

      RESOLVED: Principal-Graph's own adc-graph-sink.ts rewrite (verified
      directly against Attenuated-Delegation-Chain's real source, per that
      file's own current header) now mirrors @adc/graph's real GraphEvent
      field-for-field, and passes `event.principal` straight to
      `ensurePrincipal()` with zero translation — the kind-misattribution
      residual is gone too. This range's own bridge
      (src/adapters/adc.ts's translateGraphEventToPrincipalGraph()) is now
      a near-identity mapping (an ISO-string-to-Date conversion plus an
      action sanity check), not a field-remapping translation — see that
      function's own doc comment.
    reference: >-
      principal-graph/src/adapters/adc-graph-sink.ts (current header:
      "Verified against the real package source"; handle()'s own
      `ensurePrincipal(pool, event.principal)`, no kind override);
      attenuated-delegation-chain/packages/adc-graph/src/event.ts (the real
      GraphEvent shape this now mirrors); src/adapters/adc.ts
      (translateGraphEventToPrincipalGraph(), narrowed to a near-identity
      mapping)
    stillOpen: false
    requiresScenario: true
  - id: opt-in-policies-not-run-by-default
    name: Excessive-delegation and over-broad-root-token policies exist but are opt-in
    summary: >-
      src/policies.ts's default POLICIES array (run by `npm run
      policy-check` / GET /report out of the box) is exactly three rules:
      no-trifecta, stale-grant (admin/write relations, 30-day threshold),
      on-behalf-of-escalation. Four more rules exist in the same file —
      chain-intact, adapter-freshness, delegation-depth,
      over-broad-root-token — but are deliberately left out of the default
      set because each needs a deployment-specific threshold this project's
      own adapters refuse to guess. Concretely: a deployment that never
      configures delegation-depth/over-broad-root-token will get NO report
      signal at all for a delegation chain of unbounded depth or a root
      token scoped far beyond what its holder's own resource count would
      suggest is reasonable — this is a genuine "assumed another layer had
      it" seam, since neither ADC nor RBA runs an equivalent check either.
    reference: "principal-graph/src/policies.ts:29-36 (all seven PolicyRule kinds), :118-122 (default POLICIES — only 3 of 7)"
    stillOpen: true
    requiresScenario: true
  - id: rba-exporter-identifier-grammar-mismatch
    name: "CLOSED: the real RBA exporter's own identifier format used to violate RBA's own identifier grammar"
    summary: >-
      Originally: src/exporters/rba.ts's identityRef() builds every
      subjectId/objectId as `${source}:${externalId}` with no escaping at
      all, but relationship-based-authorization's own tuple-write
      validation applied the SAME strict schema-symbol grammar
      (IDENTIFIER_PATTERN, /^[a-z][a-z0-9_]*$/) to objectId/subjectId as it
      did to namespace/relation names — no colons, no uppercase — rejecting
      every tuple this real exporter ever tried to write. This range's own
      first faithful, byte-for-byte port of identityRef() confirmed it
      directly against a real, live RBA instance, and worked around it with
      its own sanitizer (rbaIdentifier()) rather than reproducing
      identityRef() unmodified.

      RESOLVED: relationship-based-authorization's own D-187/D-190 (PRs
      #153, #156) split the grammar — objectNs/subjectNs/relation still go
      through the strict IDENTIFIER_PATTERN, but objectId/subjectId (opaque
      foreign-system ids, not developer-authored schema symbols) now go
      through a much looser data-plane check
      (src/store/tuples.ts's invalidDataPlaneIdReason(): reject only a
      control character, '#', '@', or >512 chars) built specifically
      because the strict grammar "rejected every tuple a real external
      system (e.g. Principal-Graph...) would ever try to write" (that
      function's own doc comment). A real, unescaped `${source}:${externalId}`
      id now passes directly. This range's own rbaIdentifier() sanitizer is
      deleted (src/scenario/identifiers.ts); rbaSubject()/rbaObject() now
      send exactly what Principal-Graph's real exporter sends, byte for
      byte — the range is finally testing the real pairing, not a
      workaround for an incompatibility that no longer exists.
    reference: >-
      principal-graph/src/exporters/rba.ts (identityRef(), the unescaped
      `${source}:${externalId}` template, unchanged by any of this);
      relationship-based-authorization/src/store/tuples.ts
      (validateIdentifiers(), invalidDataPlaneIdReason() — D-187 "objectId/
      subjectId no longer share the schema DSL's identifier grammar" #153,
      D-190 #156); src/scenario/identifiers.ts (rbaSubject()/rbaObject(),
      no longer sanitized)
    stillOpen: false
    requiresScenario: false
    exemptionRationale: >-
      Closed, not merely undemonstrated: every scenario in this corpus
      already exercises the real, unescaped id path structurally, as an
      ordinary side effect of rbaSubject()/rbaObject() no longer
      sanitizing anything — there is no separate, dedicated scenario to
      write, because the fix isn't a new behavior to assert, it's the
      removal of a workaround the whole corpus now implicitly proves by
      continuing to pass real tuple writes against a live RBA instance.
  - id: workspace-grant-unescaped-identity
    name: "CLOSED: the Workspace adapter's email-shaped identities used to be rejected outright by RBA's own tuple-write grammar"
    summary: >-
      Originally: src/adapters/workspace-groups.ts keys every
      principal/resource by email (source: 'workspace', externalId e.g.
      "alice@acme.example") — the one real adapter in this whole stack whose
      externalId routinely contains '@'. @novavey/contracts's
      encodeIdentityRef (the shared identity codec this exporter and this
      range's own rbaSubject()/rbaObject() both call — see the now-closed
      rba-exporter-identifier-grammar-mismatch row above) never escaped
      anything; it just concatenated source/externalId. That unescaped '@'
      violated relationship-based-authorization's own real tuple-write
      grammar (invalidDataPlaneIdReason: no control character, '#', or
      '@'), so RBA rejected every such write with 400
      tuple_validation_failed — confirmed end to end against a real RBA
      server. src/exporters/rba.ts's own dead-letter mechanism
      (rba_export_dead_letter) then blocked the watermark for
      deadLetterThreshold runs before graduating the tuple to permanent
      per-run retry, meaning every Workspace grant Principal-Graph audits
      was silently unreachable in RBA — never a loud failure, just an
      audit tool quietly under-reporting what someone can actually reach,
      the unsafe direction. Nothing in this corpus's own scenarios, nor
      Principal-Graph's own exporter test suite, ever seeded an
      email-shaped identity, so nothing caught it before a real end-to-end
      reproduction did.

      RESOLVED: encodeIdentityRef/decodeIdentityRef now percent-encode/
      decode '%', '#', '@', and control characters in source/externalId,
      so the composite id always satisfies RBA's unchanged grammar
      regardless of what the foreign externalId contains
      (NovaVey/Stack-Contracts@9ea9e7d — @novavey/contracts 0.2.0).
      Principal-Graph's own src/exporters/rba.ts needed no code change —
      it already imported encodeIdentityRef/decodeIdentityRef, so bumping
      its dependency pin alone fixed the live bug (NovaVey/Principal-Graph#52).
      Unlike the grammar-mismatch row above, this one DOES get a dedicated
      scenario: nothing else in the corpus produces this id shape, so
      nothing else would keep it closed.
    reference: >-
      principal-graph/src/adapters/workspace-groups.ts (member.email as
      every principal/resource's own externalId); principal-graph/
      src/exporters/rba.ts (tupleFromRow(), encodeIdentityRef, the
      dead-letter mechanism this bug fed forever); stack-contracts/
      src/identity/codec.ts (encodeIdentityRef/decodeIdentityRef, now
      percent-encoding); scenarios/rebac/workspace-grant-unescaped-identity.yaml
      (this row's own dedicated scenario)
    stillOpen: false
    requiresScenario: true
