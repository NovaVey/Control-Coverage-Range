name: Control-Coverage-Range

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      repo:
        description: >-
          Which single assembled project's submodule to override — its stack/ directory
          name (principal-graph, relationship-based-authorization,
          attenuated-delegation-chain, or taint-tracked-tool-broker). Every other
          submodule stays pinned at .gitmodules' own recorded commit. Lets a sibling
          repo run this range's own corpus against its own PR head before merging,
          instead of waiting for submodule-drift.yml's weekly, all-four-at-once check —
          by then the breaking commit is already merged and unattributable. Leave unset
          (every push/pull_request/workflow_dispatch run on this repo's own history
          always does) to run entirely at normal pins. Called by composition.yml in
          each of the four sibling repos, against their own PR head.
        type: string
        required: false
      ref:
        description: >-
          Git ref `git fetch origin` accepts (branch, tag, or commit sha — a sibling
          repo's own PR head sha, or `refs/pull/<n>/head`) to check out for `repo`'s
          submodule instead of its pinned commit. Required together with `repo`.
        type: string
        required: false

permissions:
  contents: read

jobs:
  range:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: range
      POSTGRES_PASSWORD: range-ci-only
      PRINCIPAL_GRAPH_DB: principalgraph
      RBA_DB: authz_service
      RBA_ADMIN_API_KEY: ci-only-rba-admin-key-at-least-32-characters-long
      MINT_ADMIN_API_KEY: ci-only-mint-admin-key
      PRINCIPAL_GRAPH_REPORT_API_KEY: ci-only-principal-graph-report-key
      RBA_BASE_URL: http://localhost:3000
      MINT_BASE_URL: http://localhost:3001
      PRINCIPAL_GRAPH_DATABASE_URL: postgresql://range:range-ci-only@localhost:5432/principalgraph
      PRINCIPAL_GRAPH_REPORT_BASE_URL: http://localhost:8080
      # Must be the host path docker-compose.yml's mint service bind-mounts its own
      # /var/log/adc-mint to (./.range-mint-events, relative to this checkout's root,
      # which is this job's working directory) — not a path that only ever existed inside
      # that container, and not an unrelated scratch path either.
      MINT_GRAPH_EVENTS_PATH: ./.range-mint-events/events.ndjson

    steps:
      # `actions/checkout@v5` with no explicit `repository:` checks out
      # `github.repository` — and inside a `workflow_call` invocation, that's
      # the CALLING repo (e.g. relationship-based-authorization), not this
      # one: the run is fundamentally a run of the caller's workflow, this
      # job's steps are just sourced from here. Left implicit, every step
      # after this one (the submodule override, docker compose, the CLI
      # itself) silently operates on the caller's checkout instead — which
      # has no stack/ directory and no docker-compose.yml at all, so it fails
      # immediately with "No such file or directory" / "no configuration
      # file provided: not found". Found via composition.yml's first real
      # cross-repo call (this workflow_call path was, until now, "not yet
      # called by anything" — see this step's own history).
      #
      # `inputs.repo != ''` is workflow_call-only — a direct push/pull_request/
      # workflow_dispatch trigger on this repo never sets it (same test the
      # "Override one submodule" step below already uses) — so this only
      # changes behavior for the workflow_call path; a direct trigger's
      # checkout is byte-identical to before.
      - name: Checkout (workflow_call — always this repo's own default branch, regardless of caller)
        if: inputs.repo != ''
        uses: actions/checkout@v5
        with:
          repository: NovaVey/Control-Coverage-Range
          submodules: recursive

      - name: Checkout (direct trigger — the ref that triggered this run)
        if: inputs.repo == ''
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Override one submodule for a sibling repo's own PR head (workflow_call only)
        if: inputs.repo != ''
        # inputs.repo/inputs.ref go through env: rather than being spliced straight into
        # the script below via ${{ }} — a caller passing a crafted ref (this range currently
        # trusts each composition.yml to pass its own PR head sha, not arbitrary input, but
        # nothing here enforced that) would otherwise have its value substituted into the
        # script's literal text before the shell ever runs, letting it inject shell syntax
        # instead of just being data the case/test statements below inspect.
        env:
          RANGE_REPO_INPUT: ${{ inputs.repo }}
          RANGE_REF_INPUT: ${{ inputs.ref }}
        run: |
          case "$RANGE_REPO_INPUT" in
            principal-graph|relationship-based-authorization|attenuated-delegation-chain|taint-tracked-tool-broker) ;;
            *)
              echo "::error::unknown repo input '$RANGE_REPO_INPUT' — must be one of the four stack/ directory names"
              exit 1
              ;;
          esac
          if [ -z "$RANGE_REF_INPUT" ]; then
            echo "::error::repo was set but ref was not — both are required together"
            exit 1
          fi
          echo "Overriding stack/$RANGE_REPO_INPUT to $RANGE_REF_INPUT (every other submodule stays at its pinned commit)"
          git -C "stack/$RANGE_REPO_INPUT" fetch --depth 1 origin "$RANGE_REF_INPUT"
          git -C "stack/$RANGE_REPO_INPUT" checkout FETCH_HEAD
          # Read by scripts/build-stack.mjs's assertSharedPackagePinsAgree():
          # when taint-tracked-tool-broker (or principal-graph) is the one
          # being overridden, that check's own premise (every sibling's pin
          # on it already agrees) doesn't hold by construction — this run's
          # whole point is testing a commit nothing has pinned anywhere
          # else yet.
          echo "RANGE_OVERRIDE_REPO=$RANGE_REPO_INPUT" >> "$GITHUB_ENV"

      - name: Generate this run's ADC root key
        run: |
          echo "MINT_ROOT_SECRET_KEY_B64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build all four sibling projects (see scripts/build-stack.mjs)
        run: node scripts/build-stack.mjs

      - name: Install this range's own dependencies
        # --legacy-peer-deps works around a real npm/arborist crash
        # ("Cannot read properties of null (reading 'edgesOut')") resolving
        # vitest 4's own peer-dependency graph. Re-verified directly (not assumed) with
        # this range's own @types/node now aligned to ^24 across every sibling repo —
        # still reproduces identically, confirming this was never actually about
        # @types/node disagreement; it's the vitest 4/arborist bug alone. See README's
        # own "Known npm quirk" note.
        run: npm install --legacy-peer-deps

      - name: Lint, typecheck, unit test this range's own harness code
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Bring up the real assembled stack
        run: |
          docker compose up -d postgres
          docker compose run --rm migrate-pg
          # --wait blocks until rba/principal-graph/mint each report healthy per their own
          # docker-compose.yml healthcheck (or fails the step if one never does) — this
          # replaces what used to be a bare `up -d` immediately followed by a single-shot
          # `doctor` check with no actual wait behind it at all.
          docker compose up -d --wait rba principal-graph mint
        env:
          MINT_ROOT_SECRET_KEY_B64: ${{ env.MINT_ROOT_SECRET_KEY_B64 }}

      - name: Confirm every service this range's own CLI depends on is reachable
        run: |
          npx tsx src/cli/index.ts doctor

      - name: Run the full scenario corpus against the real stack
        run: npm run range:run -- --out .range-out

      - name: Check for coverage regressions against the committed baseline
        run: npm run range:check-regression -- --out .range-out

      - name: Every GAPS.md-derived taxonomy row has an asserting scenario
        run: npm run range:gaps-coverage

      # range:check-regression (src/cli/index.ts's cmdCheckRegression) already wrote its
      # own updated baseline/coverage-matrix.snapshot.json into this checkout, above — the
      # commit-baseline job below is what actually pushes it (and COVERAGE.md/README.md)
      # to main, so it needs both that file and .range-out/ here, not just the latter.
      #
      # include-hidden-files: true is required because .range-out is itself a dot
      # directory — upload-artifact@v4 silently drops hidden files/dirs by default (its
      # own "security control"), so without this the artifact only ever contained
      # baseline/coverage-matrix.snapshot.json ("1 file uploaded" in this step's own log)
      # and commit-baseline's `cp .range-out/coverage-matrix.md COVERAGE.md` failed with
      # "No such file or directory" on the very first real push-to-main run.
      - name: Upload coverage matrix + updated baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          include-hidden-files: true
          path: |
            .range-out/
            baseline/coverage-matrix.snapshot.json

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

  # Split into its own job, with its own contents:write permission, so the range job
  # above only ever needs contents:read — including when called via workflow_call from a
  # sibling repo's composition.yml, which (unlike a push straight to this repo's own main)
  # never reaches this job at all: its own `if` below is never true for a pull_request-
  # triggered caller. See the range job's own permissions history for what this replaces
  # and why: a single job requesting contents:write unconditionally, at the workflow level,
  # meant every caller had to grant write it would never actually use.
  #
  # github.event_name/github.ref alone aren't enough to gate this job: under workflow_call
  # both are the CALLING repo's — every composition.yml today only ever triggers on
  # pull_request, so this job is unreachable in practice, but that's an accident of what
  # callers currently do, not something this condition enforces. If a sibling repo's
  # composition.yml ever also ran on push to ITS OWN main, this job would try to commit
  # this range's baseline into that repo's checkout instead. The explicit repository check
  # makes this job only ever fire for a real push to this repo's own main, regardless of
  # what any caller's own triggers do.
  commit-baseline:
    needs: range
    if: >-
      github.repository == 'NovaVey/Control-Coverage-Range' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download coverage matrix + updated baseline from the range job
        uses: actions/download-artifact@v4
        with:
          name: coverage-matrix

      # Also, in this same commit: COVERAGE.md (the rendered matrix range:run already
      # wrote to .range-out/coverage-matrix.md) and its embed in README.md — see README's
      # own "Current coverage matrix" section. One commit, one push, same gate: a reader
      # shouldn't have to build four projects and run Docker to see a single cell.
      #
      # main is branch-protected ("Changes must be made through a pull request",
      # required status check "range") — a plain `git push` here always fails with
      # GH013 once the diff is ever non-empty (see the two failed runs this replaced:
      # #30/#32, both masked until PR #12/#13 first produced a real matrix change).
      # So: push to a bot branch, open a PR, and let GitHub's native auto-merge land
      # it once that PR's own required "range" check passes. The explicit
      # `gh workflow run` below is a safety net — a PR opened via GITHUB_TOKEN may not
      # itself trigger a new pull_request-triggered workflow run (GitHub suppresses
      # recursive triggers from the default token for most event types), so this
      # dispatches range.yml directly against the bot branch to guarantee the
      # required check actually runs instead of leaving the PR stuck forever.
      - name: Commit updated coverage baseline + rendered matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .range-out/coverage-matrix.md COVERAGE.md
          node scripts/update-readme-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline/coverage-matrix.snapshot.json COVERAGE.md README.md
          if git diff --cached --quiet; then
            echo "Coverage matrix unchanged."
          else
            branch="bot/coverage-baseline-${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git commit -m "chore: update coverage matrix (baseline + COVERAGE.md + README) [skip ci]"
            git push -u origin "$branch"
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update coverage matrix (baseline + COVERAGE.md + README) [skip ci]" \
              --body "Automated coverage baseline update from the \`range\` job on main (run ${GITHUB_RUN_ID}). Auto-merges once its own required \`range\` check passes.")
            gh workflow run range.yml --ref "$branch"
            gh pr merge "$pr_url" --auto --squash --delete-branch
          fi
