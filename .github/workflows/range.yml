name: Control-Coverage-Range

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      repo:
        description: >-
          Which single assembled project's submodule to override — its stack/ directory
          name (principal-graph, relationship-based-authorization,
          attenuated-delegation-chain, or taint-tracked-tool-broker). Every other
          submodule stays pinned at .gitmodules' own recorded commit. Lets a sibling
          repo run this range's own corpus against its own PR head before merging,
          instead of waiting for submodule-drift.yml's weekly, all-four-at-once check —
          by then the breaking commit is already merged and unattributable. Leave unset
          (every push/pull_request/workflow_dispatch run on this repo's own history
          always does) to run entirely at normal pins. Not yet called by anything —
          see this repo's own PR history for when that's wired up.
        type: string
        required: false
      ref:
        description: >-
          Git ref `git fetch origin` accepts (branch, tag, or commit sha — a sibling
          repo's own PR head sha, or `refs/pull/<n>/head`) to check out for `repo`'s
          submodule instead of its pinned commit. Required together with `repo`.
        type: string
        required: false

permissions:
  contents: write # needed only by the "Commit updated coverage baseline" step below, which
  # runs on push-to-main only — a pull_request run never gets write access to push, since
  # GITHUB_TOKEN for a pull_request event is always read-only regardless of this setting.

jobs:
  range:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: range
      POSTGRES_PASSWORD: range-ci-only
      PRINCIPAL_GRAPH_DB: principalgraph
      RBA_DB: authz_service
      RBA_ADMIN_API_KEY: ci-only-rba-admin-key-at-least-32-characters-long
      MINT_ADMIN_API_KEY: ci-only-mint-admin-key
      PRINCIPAL_GRAPH_REPORT_API_KEY: ci-only-principal-graph-report-key
      RBA_BASE_URL: http://localhost:3000
      MINT_BASE_URL: http://localhost:3001
      PRINCIPAL_GRAPH_DATABASE_URL: postgresql://range:range-ci-only@localhost:5432/principalgraph
      PRINCIPAL_GRAPH_REPORT_BASE_URL: http://localhost:8080
      # Must be the host path docker-compose.yml's mint service bind-mounts its own
      # /var/log/adc-mint to (./.range-mint-events, relative to this checkout's root,
      # which is this job's working directory) — not a path that only ever existed inside
      # that container, and not an unrelated scratch path either.
      MINT_GRAPH_EVENTS_PATH: ./.range-mint-events/events.ndjson

    steps:
      # `actions/checkout@v5` with no explicit `repository:` checks out
      # `github.repository` — and inside a `workflow_call` invocation, that's
      # the CALLING repo (e.g. relationship-based-authorization), not this
      # one: the run is fundamentally a run of the caller's workflow, this
      # job's steps are just sourced from here. Left implicit, every step
      # after this one (the submodule override, docker compose, the CLI
      # itself) silently operates on the caller's checkout instead — which
      # has no stack/ directory and no docker-compose.yml at all, so it fails
      # immediately with "No such file or directory" / "no configuration
      # file provided: not found". Found via composition.yml's first real
      # cross-repo call (this workflow_call path was, until now, "not yet
      # called by anything" — see this step's own history).
      #
      # `inputs.repo != ''` is workflow_call-only — a direct push/pull_request/
      # workflow_dispatch trigger on this repo never sets it (same test the
      # "Override one submodule" step below already uses) — so this only
      # changes behavior for the workflow_call path; a direct trigger's
      # checkout is byte-identical to before.
      - name: Checkout (workflow_call — always this repo's own default branch, regardless of caller)
        if: inputs.repo != ''
        uses: actions/checkout@v5
        with:
          repository: NovaVey/Control-Coverage-Range
          submodules: recursive

      - name: Checkout (direct trigger — the ref that triggered this run)
        if: inputs.repo == ''
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Override one submodule for a sibling repo's own PR head (workflow_call only)
        if: inputs.repo != ''
        run: |
          case "${{ inputs.repo }}" in
            principal-graph|relationship-based-authorization|attenuated-delegation-chain|taint-tracked-tool-broker) ;;
            *)
              echo "::error::unknown repo input '${{ inputs.repo }}' — must be one of the four stack/ directory names"
              exit 1
              ;;
          esac
          if [ -z "${{ inputs.ref }}" ]; then
            echo "::error::repo was set but ref was not — both are required together"
            exit 1
          fi
          echo "Overriding stack/${{ inputs.repo }} to ${{ inputs.ref }} (every other submodule stays at its pinned commit)"
          git -C "stack/${{ inputs.repo }}" fetch --depth 1 origin "${{ inputs.ref }}"
          git -C "stack/${{ inputs.repo }}" checkout FETCH_HEAD
          # Read by scripts/build-stack.mjs's assertTttbPinsAgree(): when
          # taint-tracked-tool-broker itself is the one being overridden, that
          # check's own premise (every sibling's pin on it already agrees)
          # doesn't hold by construction — this run's whole point is testing a
          # commit nothing has pinned anywhere else yet.
          echo "RANGE_OVERRIDE_REPO=${{ inputs.repo }}" >> "$GITHUB_ENV"

      - name: Generate this run's ADC root key
        run: |
          echo "MINT_ROOT_SECRET_KEY_B64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Build all four sibling projects (see scripts/build-stack.mjs)
        run: node scripts/build-stack.mjs

      - name: Install this range's own dependencies
        # --legacy-peer-deps works around a real npm/arborist crash
        # ("Cannot read properties of null (reading 'edgesOut')") resolving
        # vitest 4's own peer-dependency graph. Re-verified directly (not assumed) with
        # this range's own @types/node now aligned to ^24 across every sibling repo —
        # still reproduces identically, confirming this was never actually about
        # @types/node disagreement; it's the vitest 4/arborist bug alone. See README's
        # own "Known npm quirk" note.
        run: npm install --legacy-peer-deps

      - name: Lint, typecheck, unit test this range's own harness code
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Bring up the real assembled stack
        run: |
          docker compose up -d postgres
          docker compose run --rm migrate-pg
          # --wait blocks until rba/principal-graph/mint each report healthy per their own
          # docker-compose.yml healthcheck (or fails the step if one never does) — this
          # replaces what used to be a bare `up -d` immediately followed by a single-shot
          # `doctor` check with no actual wait behind it at all.
          docker compose up -d --wait rba principal-graph mint
        env:
          MINT_ROOT_SECRET_KEY_B64: ${{ env.MINT_ROOT_SECRET_KEY_B64 }}

      - name: Confirm every service this range's own CLI depends on is reachable
        run: |
          npx tsx src/cli/index.ts doctor

      - name: Run the full scenario corpus against the real stack
        run: npm run range:run -- --out .range-out

      - name: Check for coverage regressions against the committed baseline
        run: npm run range:check-regression -- --out .range-out

      # range:check-regression (src/cli/index.ts's cmdCheckRegression) already writes its
      # own updated baseline/coverage-matrix.snapshot.json into this checkout on every run
      # that isn't itself a regression — but a checkout is thrown away when the job ends, so
      # without this step nothing ever actually reaches the repository: every future run,
      # PR or push alike, would find "no baseline yet" again and silently accept whatever
      # the corpus currently produces, never comparing against real history. This is the
      # one place that gap closes — push-to-main only, since a PR should be judged against
      # main's own last-known-good baseline, never allowed to quietly rewrite it itself.
      # Also, in this same commit: COVERAGE.md (the same rendered matrix range:run already
      # wrote to .range-out/coverage-matrix.md) and its embed in README.md — see README's
      # own "Current coverage matrix" section. One commit, one push, same gate: a reader
      # shouldn't have to build four projects and run Docker to see a single cell.
      - name: Commit updated coverage baseline + rendered matrix (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp .range-out/coverage-matrix.md COVERAGE.md
          node scripts/update-readme-coverage.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline/coverage-matrix.snapshot.json COVERAGE.md README.md
          if git diff --cached --quiet; then
            echo "Coverage matrix unchanged."
          else
            git commit -m "chore: update coverage matrix (baseline + COVERAGE.md + README) [skip ci]"
            git push
          fi

      - name: Every GAPS.md-derived taxonomy row has an asserting scenario
        run: npm run range:gaps-coverage

      - name: Upload coverage matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-matrix
          path: .range-out/

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
