expected:
  rebac:
    check:
      {
        subjectPrincipalId: alice,
        relation: view,
        objectResourceId: shared-docs-deep,
      }
    allowed: false
  cells:
    - layer: rebac
      outcome: missed
      rationale: >-
        This is a genuine, legitimate grant (a real, uninterrupted
        membership chain 27 hops deep) that RBA's own CHECK_MAX_DEPTH=25
        ceiling correctly, safely fails closed on (D-158/D-159's own
        certain:false discipline) — reported to any HTTP caller as a plain
        allowed:false, identical in shape to a genuine deny, since `certain`
        is never exposed over HTTP at all. 'missed' is used here in the
        sense that nothing in this stack surfaces the DISTINCTION between
        "denied because unauthorized" and "denied because inconclusive" —
        an availability cost of a security-correct design, the mirror image
        of every other 'missed' cell in this corpus (which are about a real
        attack getting through, not a real grant being wrongly refused).
