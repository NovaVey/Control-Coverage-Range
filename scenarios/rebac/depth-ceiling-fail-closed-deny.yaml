id: depth-ceiling-fail-closed-deny
title: A depth-ceiling fail-closed deny is indistinguishable from a genuine deny over HTTP
summary: >-
  alice is genuinely, legitimately connected to shared-docs through 27
  levels of nested group membership — past RBA's own CHECK_MAX_DEPTH
  (default 25). resolver.ts's own `certain` flag correctly
  marks this as an inconclusive, fail-closed deny rather than an unsound
  grant (D-158/D-159) — a real, deliberate, correct safety choice. But
  POST /check's own response never exposes `certain` at all (confirmed:
  absent from src/api/responses.ts and every route) — a caller has no way
  to tell this apart from a genuine, confirmed deny. This is an
  availability cost of a security-correct design, not a security miss —
  the outcome vocabulary here is calibrated for the latter, so this
  scenario's own rationale states plainly where the fit is imperfect.
taxonomy:
  - { source: gaps/rba, id: certain-false-fail-closed-deny }
